name: CI — Build check

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        env:
          CI: false          # CRA treats warnings as errors when CI=true
          NODE_ENV: production
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f build/index.html ]; then
            echo "❌ build/index.html missing — build did not complete"
            exit 1
          fi
          echo "✅ Build succeeded — $(du -sh build | cut -f1) total"
