# ============================================================
# Azure Deployment Center — pre-prod
#
# HOW TO SET UP (one-time):
#   1. Azure portal → App Service (pg-processautomations-preprod) → Deployment Center
#   2. Source: GitHub → authorise → pick this repo → branch: main
#   3. Click Save — Azure will:
#      • Add AZUREAPPSERVICE_PUBLISHPROFILE_* secret to GitHub automatically
#      • Update this file with the correct secret name and app name
#
# You do NOT need to add any secrets manually.
# ============================================================

name: Build and deploy to Azure App Service — pre-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and build
        run: |
          npm install
          npm run build --if-present
        env:
          CI: false          # CRA treats warnings as errors when CI=true

      - name: Zip artifact
        run: zip -r release.zip . --exclude ".git/*" --exclude "*.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pre-prod
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Deploy to Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PREPROD }}
