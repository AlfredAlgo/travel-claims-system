name: Deploy → Pre-prod (Azure App Service)

on:
  push:
    branches: [staging]

jobs:
  build-and-deploy:
    name: Build & deploy to Azure staging slot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pre-prod      # GitHub Environment — add required reviewers here if needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install all deps (including devDependencies needed to build React)
      - name: Install dependencies
        run: npm ci

      # Build the React frontend into build/
      - name: Build React app
        env:
          CI: false
          NODE_ENV: production
        run: npm run build

      # Reinstall production-only deps — keeps the deployment artifact lean
      - name: Prune to production dependencies
        run: npm ci --omit=dev

      # Package everything Azure needs:
      #   server/   — Express API
      #   build/    — compiled React (served by Express in prod)
      #   package.json + package-lock.json — Azure Oryx uses these
      #   node_modules/ — production deps (already pruned above)
      - name: Zip deployment artifact
        run: |
          zip -r deploy.zip \
            server/ \
            build/ \
            package.json \
            package-lock.json \
            node_modules/ \
            --exclude "*.DS_Store" \
            --exclude "*/.git/*"

      - name: Deploy to Azure App Service (staging slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: staging           # targets the staging deployment slot
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PREPROD }}
          package: deploy.zip

      - name: Deployment summary
        run: |
          echo "### ✅ Pre-prod deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App | \`${{ vars.AZURE_WEBAPP_NAME }}\` (staging slot) |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`staging\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
